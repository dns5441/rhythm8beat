<body>
  <main class="app">
    <div class="top"><span class="brand-mark">♫</span><span id="siteName">8비트 리듬연습</span></div>
    <section class="card" aria-labelledby="title">
      <header class="intro"><h1 id="title">8비트 리듬연습</h1><div class="count">패턴 <span id="number">01</span></div></header>
      <hr class="divider">
      <div class="settings"><label for="practiceMode">연습 모드</label><select id="practiceMode"><option value="sight">시창 모드</option><option value="ear">청음 모드</option></select><div class="tempo"><label for="tempo">템포</label><input id="tempo" type="range" min="50" max="180" value="60"><output id="tempoValue">60 BPM</output></div><label class="metro-toggle"><input id="metronome" type="checkbox"> 메트로놈</label><label class="metro-toggle" title="재생 중인 줄은 유지하고 반대 줄을 새 리듬으로 바꿉니다."><input id="karaoke" type="checkbox"> 노래방 모드</label></div>
      <div class="options">
        <label class="check-option"><input id="countIn" type="checkbox"> 4박 카운트 인 듣고 들어가기</label>
        <label class="check-option"><input id="includeTriplets" type="checkbox"> 셋잇단 4분음표 포함</label>
        <label for="playMode">재생 방식</label><select id="playMode"><option value="loop">루프 재생</option><option value="once">한 번만 재생</option></select>
        <label for="instrument">악기</label><select id="instrument"><option value="piano">피아노</option><option value="marimba">마림바</option><option value="bell">벨</option><option value="drums">드럼 세트</option></select>
        <div class="drum-options" id="drumOptions" hidden aria-label="드럼 소리 선택"><label class="check-option"><input id="kickEnabled" type="checkbox" checked> 킥</label><label class="check-option"><input id="snareEnabled" type="checkbox" checked> 스네어</label><label class="check-option"><input id="hatEnabled" type="checkbox" checked> 하이햇</label><label class="check-option"><input id="hatSubdivision" type="checkbox"> 하이햇 8분 서브디비전</label><span class="drum-help">킥·스네어는 무작위 배치 · 드럼 악보는 2/4 두 마디씩 한 줄</span></div>
      </div>
      <div class="mixer" aria-label="볼륨 믹서">
        <div class="mix-control"><label for="instrumentVolume">악기 볼륨</label><input id="instrumentVolume" type="range" min="0" max="100" value="70"><output id="instrumentVolumeValue">70%</output></div>
        <div class="mix-control"><label for="metroVolume">메트로놈 볼륨</label><input id="metroVolume" type="range" min="0" max="100" value="35"><output id="metroVolumeValue">35%</output></div>
      </div>
      <div class="score" id="score" aria-label="2/4박자 네 마디 한 줄 타악기 악보"></div>
      <div class="legend" id="legend"><span><i class="legend-mark">♩</i>소리 내기</span><span><i class="legend-mark rest-mark">𝄽</i>쉼</span><span>♪ 8분음표 · ♩ 4분음표 · ♩. 점4분음표</span></div>
      <div class="actions"><button class="button primary" id="play">▶ 루프 재생</button><button class="button secondary" id="next">새 패턴</button><button class="button secondary" id="answer" hidden>정답 보기</button><div class="hint">스페이스바로 재생 / 정지</div></div>
    </section>
    <footer class="footer"><a href="https://www.instagram.com/kimyoungs_/" target="_blank" rel="noopener noreferrer">Instagram @kimyoungs_ ↗</a></footer>
  </main>
  <script>
    // Playback uses 12 clock pulses per quarter note so eighth notes and quarter-note triplets share one timing grid.
    const eighthTiles=[[1,1,1,1],[1,1,2],[1,2,1],[2,1,1],[2,2],[1,3],[3,1]];
    const score=document.querySelector('#score'),legend=document.querySelector('#legend'),number=document.querySelector('#number'),tempo=document.querySelector('#tempo'),tempoValue=document.querySelector('#tempoValue'),playButton=document.querySelector('#play'),metronome=document.querySelector('#metronome'),karaoke=document.querySelector('#karaoke'),countIn=document.querySelector('#countIn'),playMode=document.querySelector('#playMode'),instrument=document.querySelector('#instrument'),instrumentVolume=document.querySelector('#instrumentVolume'),metroVolume=document.querySelector('#metroVolume'),practiceMode=document.querySelector('#practiceMode'),answerButton=document.querySelector('#answer'),includeTriplets=document.querySelector('#includeTriplets'),drumOptions=document.querySelector('#drumOptions'),kickEnabled=document.querySelector('#kickEnabled'),snareEnabled=document.querySelector('#snareEnabled'),hatEnabled=document.querySelector('#hatEnabled'),hatSubdivision=document.querySelector('#hatSubdivision');
    let measures=[],sequenceNo=0,playing=false,starting=false,timer=null,step=0,audio=null,drumNoise=null,nextAudioTime=0,countInStep=0,countInActive=false,stopAfterLoop=false,answerRevealed=false,preferredPlayMode='loop',lastPracticeMode='sight',startToken=0;
    const measureTicks=()=>24,totalTicks=()=>96,tickSeconds=()=>60/Number(tempo.value)/12;
    function makeMeasure(forceFirstActive=false,forceLastActive=false){let lengths,unitScale,slotUnits,triplet=false;if(includeTriplets.checked&&Math.random()<.28){lengths=[1,1,1];unitScale=8;slotUnits=8;triplet=true}else{lengths=eighthTiles[Math.floor(Math.random()*eighthTiles.length)];unitScale=6;slotUnits=6}let previousWasRest=false;return lengths.map((value,index)=>{const forced=(index===0&&forceFirstActive)||(index===lengths.length-1&&forceLastActive),active=forced||previousWasRest||Math.random()<.62;previousWasRest=!active;return{units:value*unitScale,slotUnits,active,triplet,baseValue:value}})}
    function randomizeDrums(row){const hits=row.flat().filter(event=>event.active);hits.forEach(event=>{event.kick=Math.random()<.34;event.snare=Math.random()<.34;event.hat=Math.random()<.72;if(!event.kick&&!event.snare&&!event.hat)event.hat=true});if(hits.length&&!hits.some(event=>event.kick))hits[Math.floor(Math.random()*hits.length)].kick=true;if(hits.length&&!hits.some(event=>event.snare))hits[Math.floor(Math.random()*hits.length)].snare=true;return row}
    function makeRow(){const first=makeMeasure(true,false);const second=makeMeasure(!first[first.length-1].active,true);return randomizeDrums([first,second])}
    function makeSequence(){measures=[...makeRow(),...makeRow()];sequenceNo++;number.textContent=String(sequenceNo).padStart(2,'0');render();if(playing){step=0;stopAfterLoop=false;nextAudioTime=audio.currentTime+.1}answerRevealed=false;syncModeView()}
    function refreshRow(row){measures.splice(row*2,2,...makeRow());render()}
    function render(){const unitsPerMeasure=24,drumMode=instrument.value==='drums';score.classList.toggle('drum-mode',drumMode);score.replaceChildren();measures.forEach((events,index)=>{const measure=document.createElement('section');measure.className='measure';measure.setAttribute('aria-label',`${index+1}마디, 2/4박자`);const head=document.createElement('div');head.className='measure-head';head.innerHTML=`<span class="measure-title">${index+1}마디</span><span class="meter">2/4</span>`;if(drumMode){const lanes=document.createElement('div');lanes.className='drum-lanes';const guides=[];for(let i=1;i<4;i++){const point=i/4*100,strong=i===2,color=strong?'#dfe3dc':'#e8ebe6',width=strong?.18:.1;guides.push(`linear-gradient(to right,transparent ${point-width}%,${color} ${point}%,transparent ${point+width}%)`)}[['Hi-hat','hat',hatEnabled.checked],['Snare','snare',snareEnabled.checked],['Kick','kick',kickEnabled.checked]].forEach(([label,voice,enabled])=>{const lane=document.createElement('div');lane.className='drum-lane'+(enabled?'':' muted');const name=document.createElement('span');name.className='drum-lane-name';name.textContent=label;const grid=document.createElement('div');grid.className='drum-lane-grid';grid.dataset.measure=index;grid.style.backgroundImage=guides.join(',');let positions;if(voice==='hat'&&hatSubdivision.checked){positions=[0,6,12,18]}else{positions=[];let hitOffset=0;events.forEach(event=>{if(event[voice]&&(voice==='hat'||event.active))positions.push(hitOffset);hitOffset+=event.units})}positions.forEach(offset=>{const hit=document.createElement('span');hit.className='lane-hit'+(voice==='hat'?' hat-hit':'');hit.textContent=voice==='kick'?'●':voice==='snare'?'◆':'×';hit.style.gridColumn=`${offset+1} / span 1`;grid.append(hit)});lane.append(name,grid);lanes.append(lane)});const beats=document.createElement('div');beats.className='beat-labels';beats.style.gridTemplateColumns='repeat(24,minmax(0,1fr))';['1','&','2','&'].forEach((text,i)=>{const beat=document.createElement('span');beat.className='beat-label';beat.textContent=text;beat.style.gridColumn=`${i*6+1} / span 6`;beats.append(beat)});measure.append(head,lanes,beats);score.append(measure);return}const grid=document.createElement('div');grid.className='measure-grid';grid.style.gridTemplateColumns='repeat(24,minmax(0,1fr))';const guides=[];for(let i=1;i<4;i++){const point=i/4*100,strong=i===2,color=strong?'#dfe3dc':'#e8ebe6',width=strong?.18:.1;guides.push(`linear-gradient(to right,transparent ${point-width}%,${color} ${point}%,transparent ${point+width}%)`)}grid.style.backgroundImage=guides.join(',');if(events[0]?.triplet){const mark=document.createElement('span');mark.className='triplet-mark';mark.textContent='3';grid.append(mark)}let offset=0;events.forEach(event=>{const item=document.createElement('div');item.className='event'+(event.active?'':' rest');item.dataset.start=index*unitsPerMeasure+offset;item.style.gridColumn=`${offset+1} / span ${event.units}`;const onset=document.createElement('div');onset.className='event-start';onset.style.width=`${event.slotUnits/event.units*100}%`;const symbol=document.createElement('span');symbol.className='event-symbol';symbol.textContent=event.triplet?(event.active?'♩':'𝄽'):event.baseValue===1?(event.active?'♪':'𝄾'):(event.active?'♩':'𝄽');onset.append(symbol);if(event.baseValue===3&&!event.triplet){const dot=document.createElement('span');dot.className='event-dot';dot.textContent='·';onset.append(dot)}if(!event.triplet){const label=document.createElement('span');label.className='event-label';label.textContent=event.baseValue===1?'8분':event.baseValue===2?'4분':'점4분';onset.append(label)}item.append(onset);grid.append(item);offset+=event.units});const beats=document.createElement('div');beats.className='beat-labels';beats.style.gridTemplateColumns='repeat(24,minmax(0,1fr))';['1','&','2','&'].forEach((text,i)=>{const beat=document.createElement('span');beat.className='beat-label';beat.textContent=text;beat.style.gridColumn=`${i*6+1} / span 6`;beats.append(beat)});measure.append(head,grid,beats);score.append(measure)})}
    function getDrumNoise(){if(drumNoise)return drumNoise;const length=Math.ceil(audio.sampleRate*.5);drumNoise=audio.createBuffer(1,length,audio.sampleRate);const data=drumNoise.getChannelData(0);for(let i=0;i<length;i++)data[i]=Math.random()*2-1;return drumNoise}
    function playNoise(when,duration,cutoff,level){const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain(),volume=Number(instrumentVolume.value)/100;source.buffer=getDrumNoise();filter.type='highpass';filter.frequency.setValueAtTime(cutoff,when);gain.gain.setValueAtTime(Math.max(.0001,level*volume),when);gain.gain.exponentialRampToValueAtTime(.0001,when+duration);source.connect(filter);filter.connect(gain);gain.connect(audio.destination);source.start(when);source.stop(when+duration+.005)}
    function playKick(when){const osc=audio.createOscillator(),gain=audio.createGain(),volume=Number(instrumentVolume.value)/100;osc.type='sine';osc.frequency.setValueAtTime(150,when);osc.frequency.exponentialRampToValueAtTime(48,when+.12);gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,.32*volume),when+.006);gain.gain.exponentialRampToValueAtTime(.0001,when+.19);osc.connect(gain);gain.connect(audio.destination);osc.start(when);osc.stop(when+.2);playNoise(when,.018,1800,.07)}
    function playSnare(when){const osc=audio.createOscillator(),gain=audio.createGain(),volume=Number(instrumentVolume.value)/100;osc.type='triangle';osc.frequency.setValueAtTime(190,when);gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,.09*volume),when+.004);gain.gain.exponentialRampToValueAtTime(.0001,when+.11);osc.connect(gain);gain.connect(audio.destination);osc.start(when);osc.stop(when+.12);playNoise(when,.14,1200,.2)}
    function playHat(when){playNoise(when,.055,6500,.12)}
    function playDrum(event,when){if(event.kick&&kickEnabled.checked)playKick(when);if(event.snare&&snareEnabled.checked)playSnare(when);if(event.hat&&hatEnabled.checked&&!hatSubdivision.checked)playHat(when)}
    function playNote(event,when){if(!audio)return;if(instrument.value==='drums'){playDrum(event,when);return}const sounds={piano:{root:523.25,partials:[[1,.12],[2,.025],[3,.009]],decay:.42},marimba:{root:659.25,partials:[[1,.12],[2,.045],[3,.018],[4,.006]],decay:.24},bell:{root:783.99,partials:[[1,.11],[2,.052],[3,.028],[4,.012]],decay:.75}},sound=sounds[instrument.value]||sounds.piano,volume=Number(instrumentVolume.value)/100,duration=tickSeconds()*event.units,end=when+duration;for(const[partial,level]of sound.partials){const osc=audio.createOscillator(),gain=audio.createGain(),peak=Math.max(.0001,level*volume);osc.type='sine';osc.frequency.value=sound.root*partial;gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(peak,when+.012);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,peak*.2),when+Math.min(duration*.55,sound.decay));gain.gain.exponentialRampToValueAtTime(.0001,end);osc.connect(gain);gain.connect(audio.destination);osc.start(when);osc.stop(end+.015)}}
    function playMetro(accent=false,when){if(!audio)return;const osc=audio.createOscillator(),gain=audio.createGain(),volume=Number(metroVolume.value)/100;osc.type='sine';osc.frequency.setValueAtTime(accent?1046:784,when);osc.frequency.exponentialRampToValueAtTime(accent?850:640,when+.055);gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,(accent?.045:.03)*volume),when+.004);gain.gain.exponentialRampToValueAtTime(.0001,when+.07);osc.connect(gain);gain.connect(audio.destination);osc.start(when);osc.stop(when+.075)}
    function tick(){if(!playing)return;const horizon=audio.currentTime+.08;while(playing&&nextAudioTime<horizon){const when=nextAudioTime;if(countInActive){if(countInStep%12===0)playMetro(countInStep===0,when);countInStep++;nextAudioTime+=tickSeconds();if(countInStep>=48){countInActive=false;step=0}continue}if(stopAfterLoop){stop();break}const units=measureTicks(),loopLength=totalTicks(),measureIndex=Math.floor(step/units),localStep=step%units;if(practiceMode.value==='sight'&&karaoke.checked&&step%(units*2)===0)refreshRow(step===0?1:0);document.querySelectorAll('.event.playhead').forEach(el=>el.classList.remove('playhead'));let offset=0;const event=measures[measureIndex].find(item=>{const inside=localStep>=offset&&localStep<offset+item.units;if(!inside)offset+=item.units;return inside});const start=measureIndex*units+offset;document.querySelector(`[data-start="${start}"]`)?.classList.add('playhead');if(instrument.value==='drums'){document.querySelectorAll('.drum-lane-grid').forEach(grid=>{const active=Number(grid.dataset.measure)===measureIndex;grid.classList.toggle('active-bar',active);if(active)grid.style.setProperty('--cursor-x',`${localStep/units*100}%`)})}if(event?.active&&localStep===offset)playNote(event,when);if(instrument.value==='drums'&&hatEnabled.checked&&hatSubdivision.checked&&localStep%6===0)playHat(when);if(metronome.checked&&step%12===0)playMetro(step%units===0,when);step++;nextAudioTime+=tickSeconds();if(step>=loopLength){step=0;if(practiceMode.value==='ear'||playMode.value==='once')stopAfterLoop=true}}}
    function updatePlayLabel(){if(starting){playButton.textContent='준비 중…';return}if(playing){playButton.textContent='Ⅱ 정지';return}playButton.textContent=practiceMode.value==='ear'?'▶ 패턴 듣기':playMode.value==='once'?'▶ 한 번 재생':'▶ 루프 재생'}
    function syncModeView(){const ear=practiceMode.value==='ear';score.hidden=ear&&!answerRevealed;legend.hidden=ear&&!answerRevealed;answerButton.hidden=!ear;answerButton.textContent=answerRevealed?'정답 숨기기':'정답 보기';playMode.disabled=ear;karaoke.disabled=ear;drumOptions.hidden=instrument.value!=='drums';if(ear)playMode.value='once';else playMode.value=preferredPlayMode;const name='8비트 리듬연습';document.querySelector('#title').textContent=name;document.querySelector('#siteName').textContent=name;document.title=name;updatePlayLabel()}
    function stop(){startToken++;starting=false;playing=false;clearInterval(timer);timer=null;countInActive=false;stopAfterLoop=false;updatePlayLabel();document.querySelectorAll('.playhead').forEach(el=>el.classList.remove('playhead'))}
    async function startPlayback(){if(starting||playing)return;starting=true;const token=++startToken;clearInterval(timer);if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();updatePlayLabel();await audio.resume();await new Promise(resolve=>setTimeout(resolve,140));if(token!==startToken)return;starting=false;playing=true;step=0;countInStep=0;countInActive=countIn.checked;stopAfterLoop=false;nextAudioTime=audio.currentTime+.16;updatePlayLabel();tick();timer=setInterval(tick,25)}
    playButton.addEventListener('click',()=>playing||starting?stop():startPlayback());document.querySelector('#next').addEventListener('click',makeSequence);answerButton.addEventListener('click',()=>{answerRevealed=!answerRevealed;syncModeView()});practiceMode.addEventListener('change',()=>{if(playing||starting)stop();if(lastPracticeMode==='sight')preferredPlayMode=playMode.value;lastPracticeMode=practiceMode.value;answerRevealed=false;syncModeView()});playMode.addEventListener('change',()=>{preferredPlayMode=playMode.value;updatePlayLabel()});instrument.addEventListener('change',()=>{syncModeView();render()});[kickEnabled,snareEnabled,hatEnabled,hatSubdivision].forEach(input=>input.addEventListener('change',render));tempo.addEventListener('input',()=>{tempoValue.value=`${tempo.value} BPM`});includeTriplets.addEventListener('change',()=>{makeSequence()});[[instrumentVolume,'instrumentVolumeValue'],[metroVolume,'metroVolumeValue']].forEach(([input,outputId])=>input.addEventListener('input',()=>{document.querySelector(`#${outputId}`).value=`${input.value}%`}));document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(e.target.tagName)){e.preventDefault();playing||starting?stop():startPlayback()}});syncModeView();makeSequence();
  </script>
